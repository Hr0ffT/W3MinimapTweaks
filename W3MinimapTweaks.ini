; W3MinimapTweaks - minimap tweaks for Warcraft III 1.26a and 1.27b
; https://github.com/Hr0ffT/W3MinimapTweaks

[W3MinimapTweaks]
; 1 = the Ally Color Mode button next to the minimap (Alt+A) works in campaign missions too (the game disables it there)
CampaignAllyColors=1
; Minimap colours in Ally Color Mode: R,G,B (0..255) or a name: white, red, green, blue, yellow, orange, teal, cyan,
; purple, pink, magenta, black, gray. Empty = the game's (you white, allies teal, enemies red, creeps dark blue)
MinimapYouColor=
MinimapAllyColor=
MinimapEnemyColor=
MinimapCreepColor=
; Size of the unit / building dots on the minimap, in texels of its 256x256 picture (the game: 4 and 8).
; 0 = auto: as big on screen as the game's dots at 1080p (4K: 2 and 4, 1440p: 3 and 6, 1080p: unchanged). 1..16 = fixed
UnitDotSize=0
BuildingDotSize=0
; 1 = write W3MinimapTweaks.log (for bug reports)
Debug=0
